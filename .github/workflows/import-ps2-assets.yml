name: Import PS2 header assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-ps2-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download exact current header assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ebay/headers/current
          curl -fL --retry 3 'https://i.postimg.cc/FRn8MYRW/01-main-title.png' -o 'ebay/headers/current/01-main-title.png'
          curl -fL --retry 3 'https://i.postimg.cc/xCFhwXCs/02-standard.png' -o 'ebay/headers/current/02-standard.png'
          curl -fL --retry 3 'https://i.postimg.cc/26XMs169/03-digital.png' -o 'ebay/headers/current/03-digital.png'
          curl -fL --retry 3 'https://i.postimg.cc/PxF9gCxF/04-modern.png' -o 'ebay/headers/current/04-modern.png'
          curl -fL --retry 3 'https://i.postimg.cc/WzFCTsFm/05-ultimate.png' -o 'ebay/headers/current/05-ultimate.png'
          curl -fL --retry 3 'https://i.postimg.cc/D0JHn7Jd/06-clear-black-housing.png' -o 'ebay/headers/current/06-clear-black-housing.png'
          curl -fL --retry 3 'https://i.postimg.cc/6q2gtB2f/07-built-tested.png' -o 'ebay/headers/current/07-built-tested.png'
          curl -fL --retry 3 'https://i.postimg.cc/2ybMrCbx/08-warranty.png' -o 'ebay/headers/current/08-warranty.png'
          curl -fL --retry 3 'https://i.postimg.cc/d1Spbh19/09-ssd-fmcb-opl.png' -o 'ebay/headers/current/09-ssd-fmcb-opl.png'
          curl -fL --retry 3 'https://i.postimg.cc/mD6JvPDw/10-build-it-your-way.png' -o 'ebay/headers/current/10-build-it-your-way.png'
          curl -fL --retry 3 'https://i.postimg.cc/MTrNCnT5/11-build-your-own.png' -o 'ebay/headers/current/11-build-your-own.png'
          curl -fL --retry 3 'https://i.postimg.cc/tTmwKsT2/12-choose-your-upgrades.png' -o 'ebay/headers/current/12-choose-your-upgrades.png'
          file ebay/headers/current/*.png
          sha256sum ebay/headers/current/*.png

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PS2 Asset Import'
          git config user.email 'actions@users.noreply.github.com'
          git add ebay/headers/current/*.png
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
          else
            git commit -m 'Import current PS2 eBay header assets'
            git push origin HEAD:main
          fi
